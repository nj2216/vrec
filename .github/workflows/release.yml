name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp version from tag
        run: |
          VER="${GITHUB_REF_NAME#v}"
          sed -i "s/^VERSION = .*/VERSION = \"${VER}\"/" vrec.py
          grep -n '^VERSION' vrec.py

      - name: Build .deb
        run: |
          chmod +x build-deb.sh
          ./build-deb.sh "${GITHUB_REF_NAME#v}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.deb
            vrec.py
            install.sh
            vrec.svg
